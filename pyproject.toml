[project]
name = "rhflow-agents"
version = "0.1.0"
description = "RH Flow AI agents: LangGraph + qwen3:8b (Ollama), read-only access to RH Flow, proposals only."
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "langchain-ollama>=0.3",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7,<3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "UP035", "UP017"]
